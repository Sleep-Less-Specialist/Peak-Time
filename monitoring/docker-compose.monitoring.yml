version: "3.8"

services:
  prometheus:
    image: prom/prometheus
    container_name: peaktime-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - peak-time_default

  grafana:
    image: grafana/grafana
    container_name: peaktime-grafana
    ports:
      - "3000:3000"
    networks:
      - peak-time_default

networks:
  peak-time_default:
    external: true