<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>PeakTime - 회원가입</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #fff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 8px 24px rgba(17, 24, 39, .08);
            --radius: 14px;
            --focus: 0 0 0 3px rgba(59, 130, 246, .25);
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Apple SD Gothic Neo, "맑은 고딕", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px
        }

        .brand {
            text-align: center;
            margin-bottom: 16px;
            display: grid;
            justify-items: center;
            gap: 10px
        }

        .brand-logo-wrap {
            width: 96px;
            aspect-ratio: 1/1;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(246, 247, 251, .9));
            box-shadow: 0 10px 26px rgba(17, 24, 39, .10);
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; /* 박스에 꽉 차게 채움 */
        }

        .brand h1 {
            font-size: 20px;
            margin: 0;
            letter-spacing: -.2px
        }

        .brand-desc {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--muted)
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            background: #fff
        }

        input:focus {
            box-shadow: var(--focus);
            border-color: rgba(59, 130, 246, .55)
        }

        .field + .field {
            margin-top: 10px
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px
        }

        .btn {
            height: 44px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px
        }

        .btn:active {
            transform: translateY(1px)
        }

        .btn-primary {
            border-color: rgba(59, 130, 246, .35);
            background: rgba(59, 130, 246, .10)
        }

        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.5
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px
            }

            .row {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>
<body>
<main class="container">
    <header class="brand">
        <div class="brand-logo-wrap" aria-hidden="true">
            <img src="images/PeakTime_light _simple.png"
                 alt="PeakTime 로고" class="brand-logo"/>
        </div>
        <h1>회원가입</h1>
        <p class="brand-desc">
            PeakTime에서 학습을 시작할 준비가 되셨나요?<br/>
            기본 정보를 입력하고 계정을 생성해주세요.
        </p>
    </header>

    <section class="card">
        <!-- NOTE: 엔드포인트는 프로젝트 명세에 맞게 조정 -->
        <form id="signupForm" method="post" action="/api/v1/auth/signup">
            <div class="field">
                <label for="name">이름</label>
                <input id="name" name="name" type="text" placeholder="이름을 입력하세요" required/>
            </div>

            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="example@domain.com"
                       required/>
            </div>

            <div class="field">
                <label for="phone">휴대폰 번호</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="01012341234" required/>
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="new-password"
                       placeholder="비밀번호를 입력하세요" required/>
            </div>

            <div class="field">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password"
                       placeholder="비밀번호를 한 번 더 입력하세요" required/>
            </div>

            <div class="row">
                <button class="btn" type="button" id="backBtn">이전</button>
                <button class="btn btn-primary" type="submit">회원가입</button>
            </div>
        </form>
        <div id="signupMsg" class="hint" style="display:none; margin-top:10px;"></div>

        <p class="hint">
            * 현재는 폼 제출 방식입니다. 회원가입 API가 JSON만 받는 구조라면 추후 <code>fetch</code> 방식으로 전환하세요.
        </p>
    </section>
</main>

<script>
    document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "/index.html";
    });

    const msgEl = document.getElementById("signupMsg");

    function showMsg(text) {
        msgEl.style.display = "block";
        msgEl.textContent = text;
    }

    // 회원가입: 폼 submit을 가로채서 JSON fetch로 전송 (API가 form-urlencoded를 받지 않는 경우 404/415를 방지)
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const pw = document.getElementById("password").value;
        const pw2 = document.getElementById("passwordConfirm").value;
        if (pw !== pw2) {
            showMsg("비밀번호가 일치하지 않습니다.");
            return;
        }

        const payload = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phoneNumber: document.getElementById("phone").value,
            password: pw
        };

        try {
            const res = await fetch("/api/v1/auth/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const text = await res.text();
            let body;
            try { body = text ? JSON.parse(text) : null; } catch (_) { body = text; }

            if (!res.ok) {
                // 백엔드 표준 응답(ApiResponse) 기준으로 메시지 노출 (message + field errors)
                let detail = "회원가입에 실패했습니다.";
                if (body && typeof body === "object") {
                    if (body.message) detail = body.message;

                    // errors: [{ field, reason }]
                    if (Array.isArray(body.errors) && body.errors.length > 0) {
                        const first = body.errors[0];
                        if (first && (first.field || first.reason)) {
                            detail = `${first.field ?? "요청"}: ${first.reason ?? "유효하지 않습니다."}`;
                        }
                    }
                } else if (typeof body === "string" && body.trim().length > 0) {
                    detail = body;
                }

                showMsg(detail);
                return;
            }

            showMsg("회원가입이 완료되었습니다. 메인 페이지로 이동합니다.");
            setTimeout(() => (window.location.href = "/index.html"), 700);
        } catch (err) {
            showMsg("네트워크 오류로 회원가입 요청에 실패했습니다.");
        }
    });
</script>
</body>
</html>
