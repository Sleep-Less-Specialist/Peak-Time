<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>PeakTime - 로그인</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #fff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 8px 24px rgba(17, 24, 39, .08);
            --radius: 14px;
            --focus: 0 0 0 3px rgba(59, 130, 246, .25);
        }

        * {
            box-sizing: border-box
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Apple SD Gothic Neo, "맑은 고딕", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px
        }

        .brand {
            text-align: center;
            margin-bottom: 16px;
            display: grid;
            justify-items: center;
            gap: 10px
        }

        .brand-logo-wrap {
            width: 96px;
            aspect-ratio: 1/1;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(246, 247, 251, .9));
            box-shadow: 0 10px 26px rgba(17, 24, 39, .10);
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .brand-logo {
            width: 86px;
            height: auto;
            display: block
        }

        .brand h1 {
            font-size: 20px;
            margin: 0;
            letter-spacing: -.2px
        }

        .brand-desc {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--muted)
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            background: #fff
        }

        input:focus {
            box-shadow: var(--focus);
            border-color: rgba(59, 130, 246, .55)
        }

        .field + .field {
            margin-top: 10px
        }

        .row {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 10px;
            margin-top: 12px
        }

        .btn {
            height: 44px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px
        }

        .btn:active {
            transform: translateY(1px)
        }

        .btn-primary {
            border-color: rgba(59, 130, 246, .35);
            background: rgba(59, 130, 246, .10)
        }

        .divider {
            display: grid;
            grid-template-columns:1fr auto 1fr;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            color: var(--muted);
            font-size: 12px
        }

        .divider::before, .divider::after {
            content: "";
            height: 1px;
            background: var(--border);
            display: block
        }

        .oauth {
            display: grid;
            gap: 10px
        }

        .oauth a {
            text-decoration: none;
            display: block
        }

        .btn-oauth {
            display: grid;
            grid-template-columns:22px 1fr;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            height: 46px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            font-weight: 800;
            font-size: 14px;
            color: var(--text)
        }

        .logo {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            background: #fff
        }

        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.5
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px
            }

            .row {
                grid-template-columns:1fr
            }
        }
    </style>
</head>
<body>
<main class="container">
    <header class="brand">
        <div class="brand-logo-wrap" aria-hidden="true">
            <img src="/images/PeakTime_light_simple.png" alt="PeakTime 로고" class="brand-logo"/>
        </div>
        <h1>로그인</h1>
        <p class="brand-desc">
            이메일 또는 소셜 로그인으로<br/>
            PeakTime을 시작해보세요.
        </p>
    </header>

    <section class="card">
        <!-- NOTE: 엔드포인트는 프로젝트 명세에 맞게 조정 -->
        <form id="loginForm" method="post" action="/api/v1/auth/login">
            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="example@domain.com"
                       required/>
            </div>

            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       placeholder="비밀번호를 입력하세요" required/>
            </div>

            <div class="row">
                <button class="btn" type="button" id="goSignupBtn">회원가입</button>
                <button class="btn btn-primary" type="submit">로그인</button>
            </div>
        </form>

        <div class="divider" aria-hidden="true">또는</div>

        <div class="oauth" aria-label="소셜 로그인">
            <a href="/oauth2/authorization/google" aria-label="구글로 로그인">
                <div class="btn-oauth">
                    <div class="logo">G</div>
                    <div>Google로 계속하기</div>
                </div>
            </a>

            <a href="/oauth2/authorization/kakao" aria-label="카카오로 로그인">
                <div class="btn-oauth">
                    <div class="logo">K</div>
                    <div>Kakao로 계속하기</div>
                </div>
            </a>
        </div>

        <p class="hint">
            * OAuth 로그인 성공 시 온보딩/성공 페이지로 이동하도록 서버에서 처리합니다.
        </p>
    </section>
</main>

<script>
    document.getElementById("goSignupBtn").addEventListener("click", () => {
        window.location.href = "/signup.html";
    });
</script>
</body>
</html>
