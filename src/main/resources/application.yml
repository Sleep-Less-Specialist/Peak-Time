# 기본(local/dev)에서는 localhost로 동작
app:
  frontend:
    base-url: http://localhost:8080

---
spring:
  config:
    activate:
      on-profile: prod

# 운영(prod)에서는 환경변수로 덮어쓰되, 없으면 도메인을 기본값으로 사용
app:
  frontend:
    base-url: ${BASE_URL:http://peaktime-edu.xyz:8080}

---

spring:
  application:
    name: peaktime

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}          # REST API 키
            client-secret: ${KAKAO_CLIENT_SECRET}  # (시크릿 ON이면 필수)
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/oauth2/code/google"
            scope:
              - email
              - profile

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:create-drop}
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ID}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # 파일 업로드 용량 설정 (테스트 영상 업로드용 50MB)
  # 실제 운영 환경에선 500MB로 늘릴 예정
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  #AWS S3 설정
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}


server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: DEBUG
    # Boot 3/Hibernate 6일 때 파라미터 값 로그가 필요하면 아래 사용 고려
    # org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET_KEY}
  accessTokenExpirationMs: 3600000
  refreshTokenExpirationMs: 604800000

payment:
  toss:
    url: https://api.tosspayments.com/v1/payments
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
